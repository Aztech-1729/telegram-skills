name: Validate skill pack

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-and-javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_pack.py
      - run: python scripts/run_offline_checks.py
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: telegram-bot-javascript/assets/starter
      - run: npm test
        working-directory: telegram-bot-javascript/assets/starter
      - run: node --check telegram-bot-miniapps/assets/todo/app.js
      - run: git diff --check

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: false
      - name: Compile five independent starters
        shell: bash
        run: |
          set -euo pipefail
          for project in \
            telegram-bot-go-botapi/assets/go-telegram-echo \
            telegram-bot-go-botapi/assets/gotgbot-echo \
            telegram-bot-go-botapi/assets/classic-echo \
            telegram-bot-gotd/assets/echo \
            telegram-bot-gotd-contrib/assets/reliable-echo; do
            (cd "$project" && go build ./...)
          done

  java:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: mvn --batch-mode package
        working-directory: telegram-bot-java/assets/echo

  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build --configuration Release
        working-directory: telegram-bot-dotnet/assets/starter

  php:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: php --version
      - run: php -l webhook.php
        working-directory: telegram-bot-php/assets/starter
      - run: composer install --no-interaction --no-progress --no-scripts --no-plugins
        working-directory: telegram-bot-php/assets/starter

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustc --version
      - run: cargo check
        working-directory: telegram-bot-rust/assets/echo
